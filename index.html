<body>
    <div class="main-container">
        <div class="content">
            <button id="menuToggleBtn" title="Menu" aria-label="Menu">☰</button>
            
            <div id="themeToggleContainer">
                <button id="themeToggleBtn" class="theme-btn" title="Alternar tema" aria-label="Alternar tema">🌙</button>
            </div>
            
            <div id="clock"><span id="time">00:00:00</span><span id="temperature" aria-live="polite" title="Temperatura São Paulo Zona Sul">22ºC</span><span id="weatherIcon" title="Condição climática">🌤️</span></div>
            
            <div class="slideshow-container">
                <div id="slideshow"></div>
                <div id="statusBadge" class="status-badge"></div>
            </div>
        </div>
        
        <aside class="sidebar">
            <div class="font-selector">
                <button class="font-btn active" data-font="monospace" title="Monospace">Mono</button>
                <button class="font-btn" data-font="digital" title="Digital">Digital</button>
                <button class="font-btn" data-font="modern" title="Modern">Modern</button>
                <button class="font-btn" data-font="classic" title="Classic">Classic</button>
                <button class="font-btn" data-font="geometric" title="Geometric">Geo</button>
            </div>
            
            <div class="controls-row">
                <button id="prevBtn" class="btn-control" title="Slide anterior" aria-label="Anterior">‹</button>
                <button id="playPauseBtn" class="btn-control" title="Pausar/Reproduzir" aria-label="Pausar/Reproduzir">⏸</button>
                <button id="nextBtn" class="btn-control" title="Próximo slide" aria-label="Próximo">›</button>
            </div>
            
            <div id="sizeRangeContainer">
                <label class="size-label" for="sizeRange">Tamanho:</label>
                <input type="range" id="sizeRange" min="200" max="1200" step="10" value="400" aria-label="Tamanho do slideshow">
                <span id="sizeRangeLabel">400px</span>
            </div>
            
            <div class="speed-controls">
                <span class="speed-label">Velocidade:</span>
                <button class="speed-btn" id="speedSlow">Lento</button>
                <button class="speed-btn active" id="speedNormal">Normal</button>
                <button class="speed-btn" id="speedFast">Rápido</button>
            </div>

    <script src="slides-config.js"></script>
    <script>
        // Compatibilidade com navegadores antigos
        if (!String.prototype.padStart) {
            String.prototype.padStart = function(targetLength, padString) {
                targetLength = Math.floor(targetLength);
                padString = String(padString || ' ');
                if (padString.length === 0) return String(this);
                var padLength = targetLength - this.length;
                if (padLength <= 0) return String(this);
                var pad = '';
                while (pad.length < padLength) {
                    pad += padString;
                }
                return pad.slice(0, padLength) + String(this);
            };
        }

        // Estado global
        var state = {
            slides: [],
            current: 0,
            intervalId: null,
            isPaused: false,
            sizePx: 400,
            slideInterval: 8000,
            darkMode: true,
            loadedImages: {},
            totalImages: 0,
            loadedCount: 0
        };

        // Criar array de slides - ES5 compatível
        function createSlideArray() {
            var slides = [];
            var i;
            
            // Adiciona imagens do SLIDES_CONFIG
            if (typeof SLIDES_CONFIG !== 'undefined') {
                for (i = 0; i < SLIDES_CONFIG.length; i++) {
                    var img = SLIDES_CONFIG[i];
                    slides.push({
                        type: 'image',
                        src: 'IMAGENS PARA O SITE/' + img.id + '.' + img.ext,
                        id: img.id
                    });
                }
            }
            
            // Adiciona vídeos do VIDEOS_CONFIG
            if (typeof VIDEOS_CONFIG !== 'undefined') {
                for (i = 0; i < VIDEOS_CONFIG.length; i++) {
                    var vid = VIDEOS_CONFIG[i];
                    slides.push({
                        type: 'video',
                        src: 'IMAGENS PARA O SITE/' + vid.id + '.' + vid.ext,
                        id: vid.id
                    });
                }
            }
            
            state.totalImages = (typeof SLIDES_CONFIG !== 'undefined') ? SLIDES_CONFIG.length : 0;
            return slides;
        }

        // Embaralha array
        function shuffleArray(array) {
            var i, j, temp;
            for (i = array.length - 1; i > 0; i--) {
                j = Math.floor(Math.random() * (i + 1));
                temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        // Relógio Digital
        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var s = String(now.getSeconds()).padStart(2, '0');
            var timeEl = document.getElementById('time');
            if (timeEl) {
                timeEl.textContent = h + ':' + m + ':' + s;
            }
        }

        // Aplica tamanho ao slide
        function applySize(element) {
            var width = state.sizePx;
            var height = Math.round(state.sizePx * 0.66);
            element.style.width = width + 'px';
            element.style.height = height + 'px';
            var slideshow = document.getElementById('slideshow');
            slideshow.style.width = width + 'px';
            slideshow.style.height = height + 'px';
        }

        // Atualiza badge de status
        function updateStatusBadge() {
            var badge = document.getElementById('statusBadge');
            var current = state.slides[state.current];
            if (!current) return;
            
            if (current.type === 'video') {
                badge.textContent = '▶ Vídeo';
                badge.className = 'status-badge loaded';
            } else {
                var isLoaded = state.loadedImages[current.id];
                if (isLoaded === true) {
                    badge.textContent = '✓ Carregada (' + state.loadedCount + '/' + state.totalImages + ')';
                    badge.className = 'status-badge loaded';
                } else if (isLoaded === false) {
                    badge.textContent = '✗ Erro ao carregar';
                    badge.className = 'status-badge error';
                } else {
                    badge.textContent = '⟳ Carregando...';
                    badge.className = 'status-badge';
                }
            }
        }

        // Renderiza slide
        function renderSlide(slide, slideshow) {
            slideshow.innerHTML = '';
            clearInterval(state.intervalId);
            state.intervalId = null;
            
            if (slide.type === 'image') {
                var img = document.createElement('img');
                img.src = slide.src;
                img.alt = slide.id;
                img.className = 'fade-out';
                
                applySize(img);
                
                // Evento de carregamento
                img.onload = function() {
                    state.loadedImages[slide.id] = true;
                    state.loadedCount++;
                    updateStatusBadge();
                };
                
                // Evento de erro
                img.onerror = function() {
                    state.loadedImages[slide.id] = false;
                    img.style.opacity = '0.2';
                    updateStatusBadge();
                    // Pula para próximo slide se não carregar
                    setTimeout(function() {
                        showSlide(state.current + 1);
                    }, 1000);
                };
                
                slideshow.appendChild(img);
                
                // Fade in
                setTimeout(function() {
                    if (img.parentNode) {
                        img.classList.remove('fade-out');
                    }
                }, 30);
                
                updateStatusBadge();
                
                if (!state.isPaused) {
                    state.intervalId = setInterval(function() {
                        showSlide(state.current + 1);
                    }, state.slideInterval);
                }
            } else if (slide.type === 'video') {
                var video = document.createElement('video');
                video.src = slide.src;
                video.controls = true;
                video.autoplay = true;
                video.muted = true;
                
                // iOS compatibility
                if (video.hasAttribute) {
                    video.setAttribute('playsinline', '');
                    video.setAttribute('webkit-playsinline', '');
                }
                
                video.className = 'fade-out';
                applySize(video);
                
                video.onerror = function() {
                    video.style.opacity = '0.2';
                    // Pula para próximo slide se não carregar
                    setTimeout(function() {
                        showSlide(state.current + 1);
                    }, 1000);
                };
                
                slideshow.appendChild(video);
                
                setTimeout(function() {
                    if (video.parentNode) {
                        video.classList.remove('fade-out');
                    }
                }, 30);
                
                updateStatusBadge();
                
                if (!state.isPaused) {
                    video.onended = function() {
                        showSlide(state.current + 1);
                    };
                }
            }
        }

        // Mostra slide
        function showSlide(index) {
            state.current = (index + state.slides.length) % state.slides.length;
            var slide = state.slides[state.current];
            var slideshow = document.getElementById('slideshow');
            
            if (slideshow.firstChild) {
                slideshow.firstChild.classList.add('fade-out');
                setTimeout(function() {
                    renderSlide(slide, slideshow);
                }, 350);
            } else {
                renderSlide(slide, slideshow);
            }
        }

        // Controles
        document.getElementById('nextBtn').onclick = function() {
            showSlide(state.current + 1);
        };
        document.getElementById('prevBtn').onclick = function() {
            showSlide(state.current - 1);
        };
        document.getElementById('playPauseBtn').onclick = function() {
            state.isPaused = !state.isPaused;
            updatePlayPauseIcon();
            showSlide(state.current);
        };

        // Atualiza ícone de play/pausa
        function updatePlayPauseIcon() {
            var btn = document.getElementById('playPauseBtn');
            if (state.isPaused) {
                btn.textContent = '▶';
            } else {
                btn.textContent = '⏸';
            }
        }

        // Range de tamanho
        var sizeRange = document.getElementById('sizeRange');
        var sizeRangeLabel = document.getElementById('sizeRangeLabel');
        sizeRange.oninput = function() {
            state.sizePx = parseInt(this.value, 10);
            sizeRangeLabel.textContent = state.sizePx + 'px';
            // Salva tamanho em localStorage
            try {
                localStorage.setItem('slideshowSize', state.sizePx);
            } catch (e) {}
            showSlide(state.current);
        };
        
        // Restaura tamanho salvo
        try {
            var savedSize = localStorage.getItem('slideshowSize');
            if (savedSize) {
                var sizeValue = parseInt(savedSize, 10);
                if (!isNaN(sizeValue)) {
                    sizeRange.value = sizeValue;
                    state.sizePx = sizeValue;
                    sizeRangeLabel.textContent = sizeValue + 'px';
                }
            }
        } catch (e) {}

        // Botões de velocidade
        var speedBtns = {
            slow: { el: document.getElementById('speedSlow'), ms: 12000 },
            normal: { el: document.getElementById('speedNormal'), ms: 8000 },
            fast: { el: document.getElementById('speedFast'), ms: 3500 }
        };

        Object.keys(speedBtns).forEach(function(key) {
            speedBtns[key].el.onclick = function() {
                state.slideInterval = speedBtns[key].ms;
                Object.keys(speedBtns).forEach(function(k) {
                    speedBtns[k].el.classList.remove('active');
                });
                speedBtns[key].el.classList.add('active');
                showSlide(state.current);
            };
        });

        // Tema claro/escuro com suporte automático por horário
        var themeBtn = document.getElementById('themeToggleBtn');
        var autoTheme = true; // Começa com tema automático
        
        // Determina tema baseado na hora (18h-05h59 = escuro, resto = claro)
        function getAutoTheme() {
            var now = new Date();
            var hour = now.getHours();
            // Escuro de 18:00 até 05:59, claro para o resto
            return hour >= 18 || hour < 6;
        }
        
        function setTheme(dark, isAuto) {
            state.darkMode = dark;
            // Desativa tema automático apenas se não for uma mudança automática
            if (!isAuto) {
                autoTheme = false;
            }
            if (dark) {
                document.body.classList.remove('light-mode');
                themeBtn.textContent = '🌙';
                themeBtn.title = 'Alternar para modo claro';
            } else {
                document.body.classList.add('light-mode');
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Alternar para modo escuro';
            }
        }
        
        themeBtn.onclick = function() {
            setTheme(!state.darkMode, false);
        };
        
        // Atualiza tema automático a cada minuto
        function updateAutoTheme() {
            if (autoTheme) {
                var isDarkTime = getAutoTheme();
                // Só muda se for diferente
                if (isDarkTime !== state.darkMode) {
                    setTheme(isDarkTime, true); // true = mudança automática
                }
            }
        }
        
        // Verifica tema automático a cada minuto
        setInterval(updateAutoTheme, 60000);

        // Toggle da Sidebar
        var menuBtn = document.getElementById('menuToggleBtn');
        var sidebar = document.querySelector('.sidebar');
        
        menuBtn.textContent = '☰';

        menuBtn.onclick = function(e) {
            e.stopPropagation();
            sidebar.classList.toggle('visible');
            menuBtn.textContent = sidebar.classList.contains('visible') ? '✕' : '☰';
        };

        document.addEventListener('click', function(e) {
            if (sidebar && sidebar.classList.contains('visible')) {
                if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    sidebar.classList.remove('visible');
                    menuBtn.textContent = '☰';
                }
            }
        });

        // Seletor de Fontes
        var fontBtns = document.querySelectorAll('.font-btn');
        var clock = document.getElementById('clock');
        
        fontBtns.forEach(function(btn) {
            btn.onclick = function() {
                fontBtns.forEach(function(b) {
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                
                var fontClass = 'font-' + btn.getAttribute('data-font');
                clock.className = fontClass;
                
                // Armazena preferência no localStorage (se disponível)
                try {
                    localStorage.setItem('clockFont', btn.getAttribute('data-font'));
                } catch (e) {
                    // localStorage não disponível
                }
            };
        });
        
        // Restaura fonte salva (se disponível)
        try {
            var savedFont = localStorage.getItem('clockFont');
            if (savedFont) {
                var fontBtn = document.querySelector('[data-font="' + savedFont + '"]');
                if (fontBtn) {
                    fontBtn.click();
                }
            }
        } catch (e) {
            // localStorage não disponível
        }

        // Cache de temperatura com timestamp
        var tempCache = {
            value: null,
            lastUpdate: 0,
            cacheExpiry: 300000 // 5 minutos
        };

        // Busca temperatura de São Paulo usando Open-Meteo (CORS habilitado)
        function fetchTemperature() {
            if (typeof fetch === 'undefined') return;
            
            // Evita requisições muito frequentes
            var now = Date.now();
            if (tempCache.lastUpdate > 0 && (now - tempCache.lastUpdate) < 60000) {
                return; // Não faz requisição se atualizou há menos de 1 minuto
            }
            
            // Open-Meteo suporta CORS nativamente
            var lat = -23.5505;
            var lon = -46.6333;
            var apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + 
                         '&current=temperature_2m,weather_code&timezone=America/Sao_Paulo';
            
            fetch(apiUrl)
                .then(function(response) {
                    if (!response.ok) throw new Error('API error');
                    return response.json();
                })
                .then(function(data) {
                    if (data && data.current && typeof data.current.temperature_2m !== 'undefined') {
                        var temp = Math.round(data.current.temperature_2m);
                        tempCache.value = temp;
                        tempCache.lastUpdate = now;
                        updateTemperatureDisplay(temp);
                    } else {
                        throw new Error('Invalid data structure');
                    }
                })
                .catch(function(e) {
                    // Se tem cache válido, usa o valor anterior
                    if (tempCache.value !== null && (now - tempCache.lastUpdate) < tempCache.cacheExpiry) {
                        updateTemperatureDisplay(tempCache.value);
                        return;
                    }
                    
                    // Fallback: tenta wttr.in como alternativa
                    return fetch('https://wttr.in/?format=j1', {
                        headers: {'Accept': 'application/json'}
                    })
                        .then(function(response) {
                            if (!response.ok) throw new Error('API error');
                            return response.json();
                        })
                        .then(function(data) {
                            if (data && data.current_condition && data.current_condition[0]) {
                                var tempStr = data.current_condition[0].temp_C;
                                var temp = parseInt(tempStr, 10);
                                if (!isNaN(temp)) {
                                    tempCache.value = temp;
                                    tempCache.lastUpdate = now;
                                    updateTemperatureDisplay(temp);
                                }
                            }
                        });
                })
                .catch(function(e) {
                    // Silencia erros finais
                });
        }

        // Atualiza display de temperatura
        function updateTemperatureDisplay(temp) {
            var tempEl = document.getElementById('temperature');
            var iconEl = document.getElementById('weatherIcon');
            if (tempEl) {
                tempEl.textContent = temp + 'ºC';
            }
            if (iconEl) {
                iconEl.textContent = getWeatherIconFromTemp(temp);
            }
        }

        // Simples mapeamento baseado em temperatura
        function getWeatherIconFromTemp(temp) {
            if (temp >= 26) return '☀️'; // Muito quente
            if (temp >= 22) return '🌤️'; // Quente/Agradável
            if (temp >= 16) return '☁️'; // Morno
            if (temp >= 10) return '🌫️'; // Fresco
            return '❄️'; // Frio
        }

        // Inicialização
        state.slides = createSlideArray();
        state.slides = shuffleArray(state.slides);
        
        setInterval(updateClock, 1000);
        updateClock();
        // Atualiza temperatura a cada 60s (tenta buscar da API)
        try {
            fetchTemperature();
            setInterval(fetchTemperature, 60000);
        } catch (e) {}
        // Define tema automático baseado na hora
        updateAutoTheme();
        showSlide(0);
        updatePlayPauseIcon();
    </script>
</body>
</html>
